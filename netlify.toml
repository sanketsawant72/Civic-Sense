[build]
  base    = "."
  command = "npm run build"
  publish = "dist"

# SPA redirect — all routes go to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Proxy /api/* to your Render Express API (set VITE_API_BASE in Netlify env)
# This avoids CORS issues in production.
[[redirects]]
  from   = "/api/*"
  to     = ":splat"
  status = 200
  force  = false

[build.environment]
  NODE_VERSION = "20"
